name: borogayo
description: "House-hunting app that scores every place against the same criteria and ranks them."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  video_player: ^2.14.0
  get_thumbnail_video: ^0.7.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Only for drawing the icon and splash with tool/generate_assets.dart.
  image: ^4.9.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#7B6A8D"
  adaptive_icon_foreground: assets/icon/foreground.png

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#7B6A8D"
  image: assets/splash/splash.png
  color_dark: "#141319"
  image_dark: assets/splash/splash.png
  android_12:
    color: "#7B6A8D"
    image: assets/splash/splash_android12.png
    color_dark: "#141319"
    image_dark: assets/splash/splash_android12.png
