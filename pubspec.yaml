name: borogayo
description: "집 보러 다닐 때 쓰는 채점 앱. 같은 기준으로 매기고 점수순으로 세워 봅니다."
publish_to: 'none'

# `1.0.0` 는 사람이 보는 버전, `+1` 은 스토어가 보는 빌드 번호. 올릴 때마다 뒤가 1씩 는다.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  video_player: ^2.14.0
  get_thumbnail_video: ^0.7.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 아이콘·스플래시를 tool/generate_assets.dart 로 그린 뒤 네이티브 리소스로 넣는 데만 쓴다.
  image: ^4.9.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#7B6A8D"
  adaptive_icon_foreground: assets/icon/foreground.png

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#7B6A8D"
  image: assets/splash/splash.png
  color_dark: "#141319"
  image_dark: assets/splash/splash.png
  android_12:
    color: "#7B6A8D"
    image: assets/splash/splash_android12.png
    color_dark: "#141319"
    image_dark: assets/splash/splash_android12.png
