[package]
name = "borogayo"
version = "2.0.0"
description = "Score every place you visit against the same criteria"
authors = ["dev1f965x"]
edition = "2021"

[lib]
name = "borogayo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
